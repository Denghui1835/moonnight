<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050607" />
    <title>跟练 · FOLLOW ALONG</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div class="vignette"></div>
      <div class="grain"></div>

      <video id="cam" playsinline muted autoplay></video>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="hud-left">
            <div class="lbl">ROUND</div>
            <div id="round" class="num">1</div>
          </div>
          <div class="hud-center">
            <div id="dots" class="dots"></div>
          </div>
          <div class="hud-right">
            <div class="lbl">SCORE</div>
            <div id="score" class="num">0</div>
          </div>
        </div>
        <div id="combo" class="combo"></div>
        <div id="prompt" class="prompt"></div>
      </div>

      <div id="start" class="screen">
        <div class="title-wrap">
          <h1>跟&nbsp;练</h1>
          <div class="en">F O L L O W &nbsp; A L O N G</div>
        </div>
        <p class="brief">
          午夜排练厅只剩一面镜子。<br />
          跟着她跳。她会记住你的每一个错。
        </p>
        <div class="actions">
          <button id="btn-cam" class="primary">用摄像头跟练</button>
          <button id="btn-keys" class="ghost">键盘模式（方向键）</button>
        </div>
        <p id="loadnote" class="note">摄像头模式需要 3 秒加载姿势模型</p>
      </div>

      <div id="result" class="screen hidden">
        <div class="result-inner">
          <div class="lbl">ROUND COMPLETE</div>
          <div id="final-score" class="big-num">0</div>
          <div id="final-grade" class="grade"></div>
          <div class="stats">
            <div><span>最高连击</span><b id="final-combo">0</b></div>
            <div><span>完美动作</span><b id="final-perfect">0</b></div>
            <div><span>镜中人数</span><b id="final-heads">0</b></div>
          </div>
          <p id="final-line" class="final-line"></p>
          <button id="btn-again" class="primary">再来一遍</button>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
